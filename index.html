  .picker select{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card)}

  .picker button:hover,.chip:hover{border-color:var(--ink)}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .day{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 22px 18px;margin:0 0 20px;scroll-margin-top:16px;box-shadow:var(--shadow)}
  .day.flash{animation:flash 1.2s ease}
  @keyframes flash{0%{background:#fff3d6}100%{background:var(--card)}}
  .day h2{margin:0 0 6px;font-size:24px;letter-spacing:-.01em}
  .topics{margin:0 0 12px;color:var(--muted);font-size:14px}
  .day p.sum{margin:0 0 16px;color:#2c2c2c}
  table.lines{width:100%;border-collapse:collapse;margin:0 0 16px;font-size:15px}
  table.lines th,table.lines td{text-align:left;vertical-align:top;padding:9px 12px;border-bottom:1px solid var(--line)}
  table.lines thead th{font-size:13px;font-weight:600;color:var(--muted);background:var(--soft);border-bottom:1px solid var(--line)}
  table.lines tbody th{width:8.5em;white-space:nowrap;font-weight:600;color:var(--ink)}
  table.lines td{color:#2c2c2c}
  table.lines tbody tr:nth-child(even){background:#f8f3ea}
  table.lines th.pic,table.lines td.pic{width:160px;padding-right:10px}
  table.lines td.pic{vertical-align:middle}
  table.lines td.pic a{display:block;width:160px;line-height:0}
  table.lines td.pic img{display:block;width:160px;height:100px;object-fit:cover;border-radius:8px;background:var(--soft)}
  @media (max-width:600px){
    table.lines th.pic,table.lines td.pic{width:120px}
    table.lines td.pic a{width:120px}
    table.lines td.pic img{width:120px;height:75px}
  }
  @media (max-width:560px){table.lines tbody th{white-space:normal;width:6em}}
  .open{display:inline-block;font-weight:600;margin:0 0 14px}
  .reports{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;padding-top:12px;border-top:1px solid var(--line)}
  .reports span{color:var(--muted)}
  footer{margin-top:40px;color:var(--muted);font-size:14px}
  .wc-dog{display:inline-block;width:1.15em;height:1.15em;vertical-align:-0.18em;margin-right:.3em}

  <script>
  (function(){
    var fallback = JSON.parse(document.getElementById('days-fallback').textContent);
    function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
    function imgCell(l){
      if(!l.image) return '<td class="pic"></td>';
      var img='<img src="'+esc(l.image)+'" alt="" width="160" height="100" loading="lazy" decoding="async">';
      if(l.link) return '<td class="pic"><a href="'+esc(safeHref(l.link))+'" target="_blank" rel="noopener noreferrer">'+img+'</a></td>';
      return '<td class="pic">'+img+'</td>';
    }
    function safeHref(h){return /^(?:[a-z]+:|\/\/)/i.test(h)&&!/^https:\/\//i.test(h)?'#':h;}
    function render(days){
      days = days.slice().sort(function(a,b){return a.date<b.date?1:-1;});
      var main=document.getElementById('days'), sel=document.getElementById('date-select');
      main.innerHTML=''; sel.innerHTML='';
      days.forEach(function(d){
        var id='d-'+d.date;
        var reps=(d.reports||[]).map(function(r){return '<a href="'+esc(safeHref(r.href))+'">'+esc(r.name)+'</a>';}).join('');
        var sec=document.createElement('section'); sec.className='day'; sec.id=id;
        sec.innerHTML='<h2>'+esc(d.date)+'</h2>'+
          '<p class="topics">'+(d.topics||[]).length+' 条线：'+(d.topics||[]).map(esc).join(' · ')+'</p>'+
          ((d.lines&&d.lines.length)?'<table class="lines"><thead><tr><th scope="col">主线</th><th scope="col">要点</th><th class="pic" scope="col">原图</th></tr></thead><tbody>'+d.lines.map(function(l){return '<tr><th scope="row">'+esc(l.topic)+'</th><td>'+esc(l.text)+'</td>'+imgCell(l)+'</tr>';}).join('')+'</tbody></table>':'<p class="sum">'+esc(d.summary||'')+'</p>')+
          '<a class="open" href="'+esc(d.date)+'.html">查看详情 →</a>'+
          (reps?'<div class="reports"><span>当天日报：</span>'+reps+'</div>':'');
        main.appendChild(sec);
        var o=document.createElement('option'); o.value=d.date; o.textContent=d.date; sel.appendChild(o);
      });
      sel.onchange=function(){jump(sel.value);};
      document.getElementById('go-map').onclick=function(){ if(sel.value) location.href=sel.value+'.html'; };
      var h=location.hash.replace('#d-',''); if(h){var t=document.getElementById('d-'+h); if(t){sel.value=h; t.scrollIntoView();}}
    }
    function jump(date){
      var t=document.getElementById('d-'+date); if(!t) return;
      t.classList.remove('flash'); void t.offsetWidth; t.classList.add('flash');
      t.scrollIntoView({behavior:'smooth',block:'start'});
      if(history.replaceState) history.replaceState(null,'','#d-'+date);
    }
    render(fallback);
    if(window.fetch){
      fetch('days.json',{cache:'no-cache'}).then(function(r){if(!r.ok) throw 0; return r.json();})
        .then(function(d){ if(Array.isArray(d)&&d.length) render(d); }).catch(function(){});
    }
  })();
  </script>

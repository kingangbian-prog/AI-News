<style>
  :root{color-scheme:light;--ink:#1a1a1a;--muted:#5c5c5c;--line:#ece8e1;--bg:#f4f1ea;--bg-top:#fbf8f2;--soft:#f8f3ea;--card:#fffaf4;--shadow:0 1px 0 rgba(255,255,255,.8) inset,0 6px 16px rgba(40,30,10,.05)}
  *{box-sizing:border-box}
  body{margin:0;background-color:var(--bg);background-image:linear-gradient(180deg,#fbf8f2 0%,#f4f1ea 42%);background-attachment:fixed;background-repeat:no-repeat;color:var(--ink);font-family:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei","Segoe UI",sans-serif;font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;overflow-wrap:break-word}
  a{color:#0b57d0} a:hover{color:#0842a0}
  :focus-visible{outline:2px solid var(--ink);outline-offset:3px}
  .wrap{width:min(880px,calc(100% - 32px));margin:0 auto;padding:32px 0 80px}
  .eyebrow{margin:0 0 10px;font-size:13px;letter-spacing:.08em;color:var(--muted)}
  h1{margin:0 0 14px;font-size:clamp(28px,5vw,40px);line-height:1.22;font-weight:700;letter-spacing:-.02em}
  .lead{margin:0 0 22px;max-width:68ch;color:#2c2c2c}
  .day{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 22px 18px;margin:0 0 20px;scroll-margin-top:16px;box-shadow:var(--shadow)}
  .day.flash{animation:flash 1.2s ease}
  @keyframes flash{0%{background:#fff3d6}100%{background:var(--card)}}
  .day-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 6px}
  .day h2{margin:0;font-size:24px;letter-spacing:-.01em;min-width:0;flex:1}
  .open{
    --open:#d9772b;--open-hot:#c26420;
    flex:none;display:inline-flex;align-items:center;gap:6px;
    font:inherit;font-size:14px;font-weight:700;letter-spacing:.02em;
    padding:7px 14px 7px 12px;border:0;border-radius:999px;
    background:var(--open);color:#fff;text-decoration:none;white-space:nowrap;line-height:1.3;
    box-shadow:0 1px 0 rgba(255,255,255,.28) inset,0 4px 10px rgba(160,70,10,.22);
    transition:transform .18s ease,box-shadow .18s ease,background-color .18s ease;
  }
  .open svg{display:block;width:15px;height:15px;flex:none}
  .open .open-arrow{transition:transform .18s ease}
  .open:hover,.open.is-hover{
    background:var(--open-hot);color:#fff;
    transform:translateY(-2px);
    box-shadow:0 1px 0 rgba(255,255,255,.3) inset,0 8px 18px rgba(140,55,8,.34);
  }
  .open:hover .open-arrow,.open.is-hover .open-arrow{transform:translateX(3px)}
  .open:active{transform:translateY(0);box-shadow:0 2px 6px rgba(140,55,8,.24)}
  .open:focus-visible{outline:2px solid var(--ink);outline-offset:3px;color:#fff}
  @media (prefers-reduced-motion:reduce){
    .open,.open .open-arrow{transition:none}
    .open:hover,.open.is-hover{transform:none}
  }
  .topics{margin:0 0 12px;color:var(--muted);font-size:14px}
  .day p.sum{margin:0 0 16px;color:#2c2c2c}
  table.lines{width:100%;border-collapse:collapse;margin:0 0 16px;font-size:15px}
  table.lines th,table.lines td{text-align:left;vertical-align:top;padding:9px 12px;border-bottom:1px solid var(--line)}
  table.lines thead th{font-size:13px;font-weight:600;color:var(--muted);background:var(--soft);border-bottom:1px solid var(--line)}
  table.lines tbody th{width:8.5em;white-space:nowrap;font-weight:600;color:var(--ink)}
  table.lines td{color:#2c2c2c}
  table.lines tbody tr:nth-child(even){background:#f8f3ea}
  table.lines th.pic,table.lines td.pic{width:160px;padding-right:10px}
  table.lines td.pic{vertical-align:middle}
  table.lines td.pic a{display:block;width:160px;line-height:0}
  table.lines td.pic img{display:block;width:160px;height:100px;object-fit:cover;border-radius:8px;background:var(--soft)}
  @media (max-width:600px){
    table.lines th.pic,table.lines td.pic{width:120px}
    table.lines td.pic a{width:120px}
    table.lines td.pic img{width:120px;height:75px}
  }
  @media (max-width:560px){
    table.lines tbody th{white-space:normal;width:6em}
    .day{padding:18px 16px 16px}
    .day-head{gap:8px}
    .day h2{font-size:20px}
    .open{font-size:13px;padding:6px 12px 6px 10px;gap:5px}
    .open svg{width:14px;height:14px}
  }
  .reports{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;padding-top:12px;border-top:1px solid var(--line)}
  .reports span{color:var(--muted)}
  footer{margin-top:40px;color:var(--muted);font-size:14px}
  .wc-dog{display:inline-block;width:1.15em;height:1.15em;vertical-align:-0.18em;margin-right:.3em}
</style>
</head>

    function imgCell(l){

    function safeHref(h){return /^(?:[a-z]+:|\/\/)/i.test(h)&&!/^https:\/\//i.test(h)?'#':h;}
    function render(days){
      days = days.slice().sort(function(a,b){return a.date<b.date?1:-1;});
      var main=document.getElementById('days');
      main.innerHTML='';
      days.forEach(function(d){
        var id='d-'+d.date;
        var reps=(d.reports||[]).map(function(r){return '<a href="'+esc(safeHref(r.href))+'">'+esc(r.name)+'</a>';}).join('');

          '<a class="open" href="'+esc(d.date)+'.html">'+
          '<svg class="open-ico" viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" focusable="false"><rect x="3" y="2.5" width="10" height="11" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M6 6h4M6 8.5h4M6 11h2.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>'+

          '<p class="topics">'+(d.topics||[]).length+' 条线：'+(d.topics||[]).map(esc).join(' · ')+'</p>'+
